  <!-- Google Translate Widget -->
  <div id="google_translate_element"></div>
  <script>
    function googleTranslateElementInit() {
      new google.translate.TranslateElement({
        pageLanguage: 'ru',
        includedLanguages: 'ru,en,be',
        layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
        autoDisplay: false
      }, 'google_translate_element');
      window.googleTranslateReady = true;
      translatePage();
    }

    function translatePage() {
      window.translatePage = translatePage;
      if (!window.googleTranslateReady || !window.google || !window.google.translate) return;
      var lang = getCurrentLang();
      if (!lang || lang === 'ru') return;
      var select = document.getElementById('google_translate_element');
      if (!select) return;
      var comboBox = select.querySelector('.goog-te-combo');
      if (comboBox) {
        comboBox.value = lang;
        comboBox.dispatchEvent(new Event('change'));
      }
    }

    function getCurrentLang() {
      var match = document.cookie.match(/googtrans=\/auto\/(\w+)/);
      return match ? match[1] : null;
    }

    function debounceTranslate() {
      translatePage();
    }

    document.addEventListener('click', function(e) {
      var link = e.target.closest('a');
      if (link && link.href && link.href.startsWith(window.location.origin) && !link.target) {
        setTimeout(debounceTranslate, 200);
      }
    }, true);

    var observer = new MutationObserver(function(mutations) {
      mutations.forEach(function(mutation) {
        if (mutation.addedNodes.length > 0) {
          translatePage();
        }
      });
    });

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', function() {
        observer.observe(document.body, { childList: true, subtree: true });
      });
    } else {
      observer.observe(document.body, { childList: true, subtree: true });
    }
  </script>
  <script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
