name: CI

on:
  push:
  pull_request:

jobs:
  frontend:
    name: Frontend (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  backend:
    name: Backend (PHP lint + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          extensions: pdo_sqlite
          coverage: none
      - run: php -l backend/api.php
      - run: php -l seo.php
      - run: php backend/tests/unit.php
      - run: php backend/tests/seo.php
      - run: php backend/tests/api.php
